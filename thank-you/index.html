<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- ══════════════════════════════════════════════════════════
       VIA VINHO — THANK YOU / CONFIRMATION
       Reusable post-enquiry page. FormSubmit _next points here.
       Not indexed (no SEO value as a landing page).
  ══════════════════════════════════════════════════════════ -->

  <title>Thank you · Via Vinho</title>
  <meta name="description" content="Thank you — your enquiry has reached Via Vinho. We'll be in touch personally." />
  <meta name="robots" content="noindex, nofollow" />
  <link rel="canonical" href="https://viavinho.net/thank-you/" />

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="preload" href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;1,400&family=Poppins:wght@300;400;600&display=swap" as="style" onload="this.onload=null;this.rel='stylesheet'">
  <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;1,400&family=Poppins:wght@300;400;600&display=swap"></noscript>

  <style>
    :root{--burgundy:#6B1F2A;--alabaster:#F4F9F0;--charcoal:#1A1A1A;--ab-80:rgba(244,249,240,0.80);--ab-55:rgba(244,249,240,0.55);--ab-30:rgba(244,249,240,0.30);--font-serif:'Lora',Georgia,serif;--font-sans:'Poppins',system-ui,sans-serif;--gutter:clamp(28px,6vw,80px)}
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    html{font-size:16px}
    body{font-family:var(--font-sans);background:var(--charcoal);color:var(--alabaster);-webkit-font-smoothing:antialiased;min-height:100vh;display:flex;flex-direction:column}
    a{color:inherit;text-decoration:none}
    img{display:block;max-width:100%}

    .ty-nav{position:absolute;top:0;left:0;right:0;display:flex;justify-content:center;padding:30px var(--gutter);z-index:2}
    .ty-nav img{height:64px;width:auto}

    .ty-main{flex:1;display:flex;align-items:center;justify-content:center;text-align:center;padding:120px var(--gutter) 80px}
    .ty-inner{max-width:560px}
    .ty-mark{width:46px;height:46px;border:1px solid var(--ab-30);border-radius:50%;display:flex;align-items:center;justify-content:center;margin:0 auto 30px;color:var(--alabaster)}
    .ty-eyebrow{font-family:var(--font-sans);font-size:0.66rem;font-weight:600;letter-spacing:0.2em;text-transform:uppercase;color:var(--ab-55);margin-bottom:20px}
    .ty-h1{font-family:var(--font-serif);font-size:clamp(2.4rem,6vw,3.6rem);font-weight:400;line-height:1.1;letter-spacing:-0.02em;color:var(--alabaster);margin-bottom:24px}
    .ty-lead{font-family:var(--font-sans);font-size:1.04rem;font-weight:300;line-height:1.75;color:var(--ab-80);margin-bottom:40px}
    .ty-lead em{font-family:var(--font-serif);font-style:italic;color:var(--alabaster)}
    .ty-ctas{display:flex;align-items:center;justify-content:center;gap:16px;flex-wrap:wrap}
    .ty-btn{display:inline-flex;align-items:center;gap:10px;font-family:var(--font-sans);font-size:0.72rem;font-weight:300;letter-spacing:0.12em;text-transform:uppercase;color:var(--alabaster);border:1px solid var(--ab-30);padding:15px 28px;border-radius:2px;transition:background 200ms ease,color 200ms ease,border-color 200ms ease}
    .ty-btn:hover{background:var(--alabaster);color:var(--charcoal);border-color:var(--alabaster)}

    .ty-footer{padding:34px var(--gutter);text-align:center;font-family:var(--font-sans);font-size:0.74rem;font-weight:300;color:var(--ab-55)}
    .ty-footer a{color:var(--ab-80)}
  </style>
</head>
<body>

  <header class="ty-nav">
    <a href="/" aria-label="Via Vinho — home">
      <img src="/logos/ViaVinho_LogoDesign_Classic_White.png" alt="Via Vinho" width="3508" height="2481" />
    </a>
  </header>

  <main class="ty-main" id="content">
    <div class="ty-inner">
      <div class="ty-mark" aria-hidden="true">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M20 6L9 17l-5-5"/></svg>
      </div>
      <p class="ty-eyebrow">Enquiry received</p>
      <h1 class="ty-h1">Thank you.</h1>
      <p class="ty-lead">Your enquiry has reached us, and we'll be in touch personally — <em>usually within one business day.</em> In the meantime, you're welcome to message us directly.</p>
      <div class="ty-ctas">
        <a href="https://wa.me/351913368129" class="ty-btn" target="_blank" rel="noopener noreferrer">WhatsApp us</a>
        <a href="/" class="ty-btn">Back to Via Vinho</a>
      </div>
    </div>
  </main>

  <footer class="ty-footer">
    <p>hello@viavinho.net &nbsp;·&nbsp; Lisbon, Portugal &nbsp;·&nbsp; <a href="https://instagram.com/viavinho" target="_blank" rel="noopener">Instagram</a></p>
  </footer>

</body>
</html>
